<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="pipe-bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>
  <style>
    .step-title-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #0F172A; letter-spacing: 0.3px; }
    .step-desc-light { font-family: "JetBrains Mono", monospace; font-size: 9.5px; fill: #475569; }
    .step-num-light { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; fill: #D97706; }
  </style>

  <!-- Background card -->
  <rect width="1100" height="130" rx="10" fill="url(#pipe-bg-light)" stroke="#E2E8F0" stroke-width="1.2" />

  <!-- Stage 1: Ingestion & Downsampling -->
  <g transform="translate(20, 18)">
    <rect width="190" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="22" r="8" fill="#F1F5F9" />
    <text x="20" y="25" text-anchor="middle" class="step-num-light">01</text>
    <text x="36" y="25" class="step-title-light">Audio Stream Ingestion</text>
    <text x="14" y="48" class="step-desc-light">• Web Audio API &amp; WS</text>
    <text x="14" y="65" class="step-desc-light">• 11,025 Hz Downsampling</text>
    <text x="14" y="82" class="step-desc-light">• Polyphase FIR Filtering</text>
  </g>

  <!-- Arrow 1-2 -->
  <polygon points="237,65 231,61 231,69" fill="#0284C7" />
  <line x1="215" y1="65" x2="235" y2="65" stroke="#0284C7" stroke-width="2" />

  <!-- Stage 2: Spectral Analysis -->
  <g transform="translate(242, 18)">
    <rect width="190" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="22" r="8" fill="#F1F5F9" />
    <text x="20" y="25" text-anchor="middle" class="step-num-light">02</text>
    <text x="36" y="25" class="step-title-light">Radix-2 FFT &amp; STFT</text>
    <text x="14" y="48" class="step-desc-light">• Cooley–Tukey FFT Engine</text>
    <text x="14" y="65" class="step-desc-light">• Hann Window Spectral Slices</text>
    <text x="14" y="82" class="step-desc-light">• Frequency Bin Decomposition</text>
  </g>

  <!-- Arrow 2-3 -->
  <polygon points="457,65 451,61 451,69" fill="#0284C7" />
  <line x1="435" y1="65" x2="455" y2="65" stroke="#0284C7" stroke-width="2" />

  <!-- Stage 3: Constellation & Hash -->
  <g transform="translate(462, 18)">
    <rect width="190" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="22" r="8" fill="#F1F5F9" />
    <text x="20" y="25" text-anchor="middle" class="step-num-light">03</text>
    <text x="36" y="25" class="step-title-light">Constellation Hashing</text>
    <text x="14" y="48" class="step-desc-light">• Local Magnitude Peaks</text>
    <text x="14" y="65" class="step-desc-light">• Target-Zone Point Pairing</text>
    <text x="14" y="82" class="step-desc-light">• 32-Bit Bitpacked Hashes</text>
  </g>

  <!-- Arrow 3-4 -->
  <polygon points="677,65 671,61 671,69" fill="#D97706" />
  <line x1="655" y1="65" x2="675" y2="65" stroke="#D97706" stroke-width="2" />

  <!-- Stage 4: Index Retrieval -->
  <g transform="translate(682, 18)">
    <rect width="185" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="22" r="8" fill="#F1F5F9" />
    <text x="20" y="25" text-anchor="middle" class="step-num-light">04</text>
    <text x="36" y="25" class="step-title-light">PostgreSQL Index</text>
    <text x="14" y="48" class="step-desc-light">• B-tree Hash Inverted Index</text>
    <text x="14" y="65" class="step-desc-light">• Low-Latency Sub-Query</text>
    <text x="14" y="82" class="step-desc-light">• Candidate Track Retrieval</text>
  </g>

  <!-- Arrow 4-5 -->
  <polygon points="892,65 886,61 886,69" fill="#D97706" />
  <line x1="870" y1="65" x2="890" y2="65" stroke="#D97706" stroke-width="2" />

  <!-- Stage 5: Time Offset Alignment -->
  <g transform="translate(897, 18)">
    <rect width="183" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <circle cx="20" cy="22" r="8" fill="#F1F5F9" />
    <text x="20" y="25" text-anchor="middle" class="step-num-light">05</text>
    <text x="36" y="25" class="step-title-light">Histogram Matching</text>
    <text x="14" y="48" class="step-desc-light">• Offset Delta Clustering</text>
    <text x="14" y="65" class="step-desc-light">• Coherence Peak Scoring</text>
    <text x="14" y="82" class="step-desc-light">• False-Positive Rejection</text>
  </g>
</svg>
